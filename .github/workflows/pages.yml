name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Export the static desk
        working-directory: web
        env:
          # The Pages path is the repository name, so a rename to fintec-same-person
          # publishes at /fintec-same-person/ without another code change.
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm ci
          npm run build:pages
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out
      - name: Wait until the site artifact is listed
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
